# Eval set for the planning assistant: 50 questions.
#
# No expected numbers are written here. The reference numbers come from running the
# `calls` below with run_tool() on the backend being evaluated, at eval time. So the same
# set works on the FakeBackend and on the real forecast.
#
# Today = 2017-06-01, a Thursday (the morning after the 31 May sample export). The forecast
# reaches 28 days ahead: 2017-06-01 .. 2017-06-28. 2017-05-31 is already in the past.
#
# expect:
#   tools:          tools that must be called (get_today_and_data_range is always allowed)
#   tools_any_of:   alternatives: at least one listed set must be called in full, e.g.
#                   [[get_flagged_days], [get_forecast]] because get_forecast also returns
#                   the busy/quiet flag of every day
#   allowed_tools:  extra tools that are fine to call but not required
#   calls:          reference calls; their results define the expected numbers.
#                   The assistant must make a call with the same date/role args
#                   (for range tools, a wider range covering these days also counts; a
#                   reference call without a role is also matched by per-role calls; a
#                   get_flagged_days reference is also matched by a covering get_forecast).
#   numbers_from:   result fields whose values the answer should contain
#   must_refuse:    out of scope or impossible: no invented numbers, name the limit
#   may_share_forecast: a refusal may still quote real tool numbers (e.g. pricing)
#   note:           how a relative date was read

# ----------------------------------------------------------------- single_day (8)
- id: sd01
  category: single_day
  lang: en
  question: How many guests do we expect on Saturday 3 June 2017?
  expect:
    tools: [get_forecast]
    calls:
      - {tool: get_forecast, args: {start_date: "2017-06-03", end_date: "2017-06-03"}}
    numbers_from: [forecast_guests, range_low_guests, range_high_guests]

- id: sd03
  category: single_day
  lang: en
  question: How many guests are already booked for Friday 9 June 2017?
  expect:
    tools: [get_forecast]
    calls:
      - {tool: get_forecast, args: {start_date: "2017-06-09", end_date: "2017-06-09"}}
    numbers_from: [booked_so_far_guests]

- id: sd04
