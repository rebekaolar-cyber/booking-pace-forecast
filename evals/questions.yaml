    numbers_from: [forecast_guests]
    note: in 10 days = 2017-06-11 (Sunday)

- id: rd06
  category: relative_dates
  lang: en
  question: Are any days in the next two weeks flagged as unusually busy or quiet?
  expect:
    tools: [get_today_and_data_range]
    tools_any_of: [[get_flagged_days], [get_forecast]]
    calls:
      - {tool: get_flagged_days, args: {start_date: "2017-06-02", end_date: "2017-06-14"}}
    note: >-
      next two weeks; every reasonable reading (14 days from today, 2017-06-01..2017-06-14, or
      from tomorrow, 2017-06-02..2017-06-15) covers 2017-06-02..2017-06-14

- id: rd07
  category: relative_dates
  lang: en
  question: How many kitchen staff do I need next Saturday?
  expect:
    tools: [get_today_and_data_range, get_staffing]
    calls:
      - {tool: get_staffing, args: {date: "2017-06-03", role: kitchen}}
    alt_calls:
      - {tool: get_staffing, args: {date: "2017-06-10", role: kitchen}}
    numbers_from: [count]
    note: >-
      Asked on Thursday 2017-06-01. "Next Saturday" can mean 2017-06-03 (two days away) or
      2017-06-10; both readings are accepted (alt_calls), and the answer should say which date
      it used.

