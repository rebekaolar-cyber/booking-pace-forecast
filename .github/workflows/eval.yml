name: eval

# The live eval: real model calls on the real forecast, on push to main or a manual run, and
# only when the ANTHROPIC_API_KEY secret is set (unit tests run in tests.yml). It fails the build
# when a run ends in an error or fewer than 80% of answers have every number traced to a tool.
# Flags above that are shown as warnings to check by hand: the scorer has known false alarms.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sample:
        description: "Number of eval questions to run live (spread over the categories)"
        required: false
        default: "10"
      model:
        description: "Model to evaluate"
        required: false
        default: "claude-haiku-5-5"
      prompt:
        description: "Prompt version to evaluate (prompts/<version>.md)"
        required: false
        default: "v2"
      repeat:
        description: "Ask the same questions this many times, to see how stable the scores are"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    # The key is given only to the two steps that need it, not to pip install or checkout.
    steps:
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ANTHROPIC_API_KEY secret set; skipping the live eval."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'

      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt -r requirements-dev.txt

      - name: Live eval
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Inputs go through env, not straight into the script, so they cannot inject shell code.
          EVAL_SAMPLE: ${{ inputs.sample || '10' }}
          EVAL_MODEL: ${{ inputs.model || 'claude-haiku-5-5' }}
          EVAL_PROMPT: ${{ inputs.prompt || 'v2' }}
          EVAL_REPEAT: ${{ inputs.repeat || '1' }}
        run: |
          python -m evals.run --backend real --sample "$EVAL_SAMPLE" --model "$EVAL_MODEL" --min-faithfulness 0.8 --prompt "$EVAL_PROMPT" --repeat "$EVAL_REPEAT"

      - name: Upload eval results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
