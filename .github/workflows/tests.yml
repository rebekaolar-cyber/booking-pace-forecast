name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-agent.txt -r requirements-dev.txt
      # Includes tests/test_app.py, which runs the whole app and fails on any exception.
      - name: Tests (forecast incl. the full backtest, the app, AI assistant, eval scoring; no API calls)
        run: python -m pytest -q
